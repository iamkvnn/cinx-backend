      x-event-version: 1

    UserInstructorTerminated:
      name: UserInstructorTerminated
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserInstructorTerminatedPayload"
      x-event-type: user.instructor.terminated
      x-event-version: 1

    UserInstructorPending:
      name: UserInstructorPending
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserInstructorPendingPayload"
      x-event-type: user.instructor.pending
      x-event-version: 1

    UserInstructorApplicationSubmitted:
      name: UserInstructorApplicationSubmitted
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserInstructorApplicationSubmittedPayload"
      x-event-type: user.instructor.application.submitted
      x-event-version: 1

    UserPreferenceUpdated:
      name: UserPreferenceUpdated
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserPreferenceUpdatedPayload"
      x-event-type: user.preference.updated
      x-event-version: 1

    UserLearningProfileUpdated:
      name: UserLearningProfileUpdated
      summary: The learner's whole learning profile after a write; a consumer keeps the newest by occurredAt.
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserLearningProfileUpdatedPayload"
      x-event-type: user.learning-profile.updated
      x-event-version: 1

    UserProfileOnboarded:
      name: UserProfileOnboarded
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserProfileOnboardedPayload"
      x-event-type: user.profile.onboarded
      x-event-version: 1

    UserPolicyPublished:
      name: UserPolicyPublished
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserPolicyPublishedPayload"
      x-event-type: user.policy.published
      x-event-version: 1

    UserPolicyArchived:
      name: UserPolicyArchived
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/UserPolicyArchivedPayload"
      x-event-type: user.policy.archived
      x-event-version: 1

    SubtitleJobProgress:
      name: SubtitleJobProgress
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/SubtitleJobProgressPayload"
      x-event-type: SubtitleJobProgress
      x-event-version: 1

    SubtitleJobCompleted:
      name: SubtitleJobCompleted
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/SubtitleJobCompletedPayload"
      x-event-type: SubtitleJobCompleted
      x-event-version: 1

    SubtitleJobFailed:
      name: SubtitleJobFailed
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/SubtitleJobFailedPayload"
      x-event-type: SubtitleJobFailed
      x-event-version: 1

    CommerceSubscriptionEntitlementsChanged:
      name: CommerceSubscriptionEntitlementsChanged
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/CommerceSubscriptionEntitlementsChangedPayload"
      x-event-type: commerce.subscription.entitlements.changed
      x-event-version: 1

    AssistantActionDecided:
      name: AssistantActionDecided
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/AssistantActionDecidedPayload"
      x-event-type: AssistantActionDecided
      x-event-version: 1

  schemas:
    CommerceSubscriptionEntitlementsChangedPayload:
      type: object
      additionalProperties: false
      required:
        - eventId
        - subjectType
        - subjectId
        - userId
        - entitlementVersion
        - accessStatus
        - effectiveFrom
        - accessEffectiveUntil
        - reconcileBy
        - currentPeriodStart
        - currentPeriodEnd
        - sources
        - features
        - occurredAt
      properties:
        eventId: { type: string, minLength: 1 }
        subjectType: { type: string, enum: [USER] }
        subjectId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        entitlementVersion: { type: integer, format: int64, minimum: 0 }
        accessStatus: { type: string, enum: [ACTIVE, GRACE, INELIGIBLE, ENDED, INACTIVE] }
        effectiveFrom: { $ref: "#/components/schemas/Timestamp" }
        accessEffectiveUntil: { $ref: "#/components/schemas/NullableTimestamp" }
        validUntil: { $ref: "#/components/schemas/NullableTimestamp" }
        reconcileBy: { $ref: "#/components/schemas/NullableTimestamp" }
        currentPeriodStart: { $ref: "#/components/schemas/NullableTimestamp" }
        currentPeriodEnd: { $ref: "#/components/schemas/NullableTimestamp" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EntitlementSource" }
        features:
          type: array
          items: { $ref: "#/components/schemas/EntitlementFeature" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }

    EntitlementSource:
      type: object
      additionalProperties: false
      required: [subscriptionId, subscriptionAggregateVersion, subscriptionSlot, productLine, planCode, planVersion]
      properties:
        subscriptionId: { type: string, minLength: 1 }
        subscriptionAggregateVersion: { type: integer, format: int64, minimum: 1 }
        subscriptionSlot: { type: string, minLength: 1 }
        productLine: { type: string, minLength: 1 }
        planCode: { type: string, minLength: 1 }
        planVersion: { type: integer, format: int64, minimum: 1 }

    EntitlementFeature:
      type: object
      additionalProperties: false
      required: [key, type, effectiveUntil]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]*(?:\\.[a-z0-9-]+)+$" }
        type: { type: string, enum: [BOOLEAN, QUOTA] }
        enabled: { type: boolean }
        limit: { type: integer, format: int64, minimum: 0 }
        unlimited: { type: boolean }
        unit: { type: string, enum: [REQUEST, MINUTE, CREDIT] }
        resetPolicy: { type: string, enum: [CALENDAR_MONTH, SUBSCRIPTION_PERIOD] }
        periodStart: { $ref: "#/components/schemas/NullableTimestamp" }
        periodEnd: { $ref: "#/components/schemas/NullableTimestamp" }
        effectiveUntil: { $ref: "#/components/schemas/NullableTimestamp" }

    EventHeaders:
      type: object
      additionalProperties: true
      required:
        - eventId
        - eventType
        - eventVersion
        - aggregateType
        - aggregateId
        - occurredAt
      properties:
        eventId:
          type: string
          minLength: 1
          description: Stable idempotency key for this event.
        eventType:
          type: string
          minLength: 1
        eventVersion:
          type: integer
          minimum: 1
        aggregateType:
          type: string
          minLength: 1
        aggregateId:
          type: string
          minLength: 1
        occurredAt:
          $ref: "#/components/schemas/Timestamp"
        traceparent:
          type: string
          pattern: "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
          description: Optional W3C trace context propagated from the originating request.
        X-Request-Id:
          type: string
          minLength: 1
          description: Optional request correlation identifier.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 date-time. See x-known-runtime-drift for legacy LocalDateTime publishers.

    NullableString:
      oneOf:
        - type: string
        - type: "null"

    NullableTimestamp:
      oneOf:
        - $ref: "#/components/schemas/Timestamp"
        - type: "null"

    MonetaryAmount:
      type: number
      format: decimal
      multipleOf: 0.01

    NullableMonetaryAmount:
      oneOf:
        - $ref: "#/components/schemas/MonetaryAmount"
        - type: "null"

    AuthAuthorizationChangedPayload:
      type: object
      additionalProperties: false
      required: [userId, status, roles, permissions, authorizationVersion, authorizationPolicyVersion, effectiveAt]
      properties:
        userId: { type: string, minLength: 1 }
        status: { type: string, enum: [ACTIVE, BANNED] }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$" }
        authorizationVersion: { type: integer, format: int64, minimum: 1 }
        authorizationPolicyVersion: { type: integer, format: int64, minimum: 1 }
        effectiveAt:
          $ref: "#/components/schemas/Timestamp"

    CommerceOrderPaidPayload:
      type: object
      additionalProperties: false
      required: [eventId, orderId, userId, totalAmount, originalAmount, discountAmount, items]
      properties:
        eventId: { type: string, minLength: 1 }
        orderId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        totalAmount:
          $ref: "#/components/schemas/MonetaryAmount"
        originalAmount:
          $ref: "#/components/schemas/MonetaryAmount"
        discountAmount:
          $ref: "#/components/schemas/MonetaryAmount"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CommerceOrderItem"

    CommerceOrderItem:
      type: object
      additionalProperties: false
      required: [courseId, title, price]
      properties:
        courseId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        price:
          $ref: "#/components/schemas/MonetaryAmount"

    CommerceWishlistPayload:
      type: object
      additionalProperties: false
      required: [eventId, userId, courseId, added]
      properties:
        eventId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        added: { type: boolean }

    LearningEnrollmentGrantedPayload:
      type: object
      additionalProperties: false
      required: [userId, courseId, grantedAt]
      properties:
        userId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        grantedAt:
          $ref: "#/components/schemas/Timestamp"

    CourseSellabilityChangedPayload:
      type: object
      additionalProperties: false
      required: [eventId, courseId, title, price, categoryId, instructorId, sellable, occurredAt]
      properties:
        eventId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        price:
          $ref: "#/components/schemas/MonetaryAmount"
        categoryId: { type: string, minLength: 1 }
        instructorId: { type: string, minLength: 1 }
        sellable: { type: boolean }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CourseTranscriptsChangedPayload:
      type: object
      additionalProperties: false
      required: [eventId, courseId, reason, occurredAt]
      properties:
        eventId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        reason:
          type: string
          enum: [PUBLISHED, UNARCHIVED, ARCHIVED, TRACK_CHANGED]
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    LearningPathCheckoutRequestedPayload:
      type: object
      additionalProperties: false
      required: [eventId, userId, courseId]
      properties:
        eventId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }

    CourseRecommendationEventPayload:
      type: object
      additionalProperties: false
      required: [course, timestamp]
      properties:
        course:
          $ref: "#/components/schemas/CourseRecommendationPayload"
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    CourseRecommendationPayload:
      type: object
      additionalProperties: false
      required: [id, title, status]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description:
          $ref: "#/components/schemas/NullableString"
        category:
          oneOf:
            - $ref: "#/components/schemas/CourseCategory"
            - type: "null"
        instructor:
          oneOf:
            - $ref: "#/components/schemas/CourseInstructor"
            - type: "null"
        images:
          type: array
          items:
            $ref: "#/components/schemas/CourseImage"
        price:
          $ref: "#/components/schemas/NullableMonetaryAmount"
        discountedPrice:
          $ref: "#/components/schemas/NullableMonetaryAmount"
        discountRate:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        rating:
          oneOf:
            - type: number
              format: double
            - type: "null"
        enrollmentCount:
          type: integer
          format: int64
          minimum: 0
        isInSubscription: { type: boolean }
        # Additive access contract for the F1 compatibility window. Consumers
        # must prefer these fields and fall back to isInSubscription only for
        # legacy events that do not carry them.
        accessModel:
          oneOf:
            - type: string
              enum: [FREE, PURCHASE_ONLY, SUBSCRIPTION_ONLY, PURCHASE_OR_SUBSCRIPTION]
            - type: "null"
        subscriptionFeatureKey:
          $ref: "#/components/schemas/NullableString"
        duration:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        hasCertificate: { type: boolean }
        certificateTitle:
          $ref: "#/components/schemas/NullableString"
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        publishStatus:
          oneOf:
            - type: string
              enum: [WAITING_APPROVAL, PUBLISHED, REJECTED]
            - type: "null"
        sections:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CurriculumSection"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/NullableTimestamp"
        updatedAt:
          $ref: "#/components/schemas/NullableTimestamp"

    CourseCategory:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/NullableString"
        name:
          $ref: "#/components/schemas/NullableString"

    CourseInstructor:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/NullableString"
        name:
          $ref: "#/components/schemas/NullableString"
        email:
          $ref: "#/components/schemas/NullableString"
        gender:
          oneOf:
            - type: string
              enum: [MALE, FEMALE]
            - type: "null"
        avatarUrl:
          $ref: "#/components/schemas/NullableString"

    CourseImage:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/NullableString"
        imageUrl:
          $ref: "#/components/schemas/NullableString"

    CurriculumSection:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description:
          $ref: "#/components/schemas/NullableString"
        duration:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        orderIndex:
          oneOf:
            - type: integer
            - type: "null"
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumLesson"

    CurriculumLesson:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        duration:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        lessonType:
          oneOf:
            - type: string
              enum: [VIDEO, ARTICLE, QUIZ, ASSIGNMENT]
            - type: "null"
        orderIndex:
          oneOf:
            - type: integer
            - type: "null"
        isPreview:
          oneOf:
            - type: boolean
            - type: "null"
        prerequisiteIds:
          type: array
          items: { type: string }
        createdAt:
          $ref: "#/components/schemas/NullableTimestamp"
        updatedAt:
          $ref: "#/components/schemas/NullableTimestamp"

    CourseContentPublishedPayload:
      type: object
      additionalProperties: false
      required: [courseId, courseTitle, instructorId]
      properties:
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        instructorId: { type: string, minLength: 1 }
        instructorIds:
          type: array
          description: Optional publication-time snapshot of active course instructors.
          uniqueItems: true
          items: { type: string, minLength: 1 }

    CourseApprovalRequestedPayload:
      type: object
      additionalProperties: false
      required: [courseId, courseTitle, instructorId]
      properties:
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        instructorId: { type: string, minLength: 1 }

    CourseCollaboratorInvitedPayload:
      type: object
      additionalProperties: false
      description: Ids and the course title only; the consumer looks names and the email up itself.
      required: [courseId, courseTitle, inviterId, inviteeId, role, invitedAt]
      properties:
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        inviterId: { type: string, minLength: 1 }
        inviteeId: { type: string, minLength: 1 }
        role: { type: string, enum: [MANAGER, EDITOR] }
        invitedAt:
          $ref: "#/components/schemas/Timestamp"

    CourseCompletedPayload:
      type: object
      additionalProperties: false
      required: [userId, courseId, courseTitle, occurredAt]
      properties:
        userId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    DailyReminderDuePayload:
      type: object
      additionalProperties: false
      required: [userId, goalType, targetValue, currentValue, targetItemId, occurredAt]
      properties:
        userId: { type: string, minLength: 1 }
        goalType:
          type: string
          enum: [XP, LEARNING_ITEMS_COMPLETED, VIDEOS_COMPLETED, QUIZZES_PASSED, ASSIGNMENTS_SUBMITTED, SPECIFIC_LESSON_COMPLETED]
        targetValue: { type: integer, minimum: 0 }
        currentValue: { type: integer, minimum: 0 }
        targetItemId:
          $ref: "#/components/schemas/NullableString"
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    StudyReminderDuePayload:
      type: object
      additionalProperties: false
      description: At most one per learner and day; the eventId is study-reminder:{userId}:{reminderDate}.
      required: [userId, reason, title, body, actionUrl, writtenBy, reminderDate, occurredAt]
      properties:
        userId: { type: string, minLength: 1 }
        reason:
          type: string
          enum: [PLAN_SESSION_PENDING, STREAK_AT_RISK, REVIEWS_DUE, DAILY_GOAL_PENDING, INACTIVE]
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 500 }
        actionUrl:
          type: string
          description: A cinx-web route, /learning/{courseId}?lessonId={lessonId}, /review or /week.
        writtenBy:
          type: string
          enum: [TEMPLATE, AI]
        reminderDate:
          type: string
          format: date
          description: The day in Asia/Ho_Chi_Minh.
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    SubtitleJobFinishedPayload:
      type: object
      additionalProperties: false
      description: One per job and outcome; the eventId is subtitle-job:{jobId}:{outcome}. Sent only when a person started the job.
      required: [jobId, userId, courseId, lessonId, languageCode, displayName, outcome, warningCount, actionUrl, occurredAt]
      properties:
        jobId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1, description: The instructor who started the job. }
        courseId: { type: string, minLength: 1 }
        lessonId: { type: string, minLength: 1, description: The lesson's stable id. }
        lessonTitle:
          $ref: "#/components/schemas/NullableString"
        languageCode: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        outcome:
          type: string
          enum: [REVIEW_REQUIRED, FAILED]
        warningCount: { type: integer, minimum: 0, description: Quality warnings on the track; 0 for FAILED. }
        actionUrl:
          type: string
          description: The cinx-web editor route, /instructor/courses/{courseId}/edit?lesson={lessonId}.
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CertificateRequestedPayload:
      type: object
      additionalProperties: false
      required: [requestId, userId, userName, courseId, courseTitle, instructorId, instructorEmail, occurredAt]
      properties:
        requestId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        userName:
          $ref: "#/components/schemas/NullableString"
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        instructorId:
          $ref: "#/components/schemas/NullableString"
        instructorEmail:
          $ref: "#/components/schemas/NullableString"
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CertificateApprovedPayload:
      type: object
      additionalProperties: false
      required: [requestId, userId, userName, userEmail, courseId, courseTitle, certificateUrl, occurredAt]
      properties:
        requestId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        userName: { type: string, minLength: 1 }
        userEmail: { type: string, format: email }
        courseId: { type: string, minLength: 1 }
        courseTitle: { type: string, minLength: 1 }
        certificateUrl: { type: string, minLength: 1 }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CourseReviewCreatedPayload:
      type: object
      additionalProperties: false
      required: [eventId, reviewId, courseId, reviewerUserId, rating, content, occurredAt]
      properties:
        eventId: { type: string, minLength: 1 }
        reviewId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        reviewerUserId: { type: string, minLength: 1 }
        rating: { type: number, format: double }
        content: { type: string }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CourseQuestionCreatedPayload:
      type: object
      additionalProperties: false
      required: [eventId, questionId, courseId, lessonId, askedByUserId, questionTitle, occurredAt]
      properties:
        eventId: { type: string, minLength: 1 }
        questionId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        lessonId:
          $ref: "#/components/schemas/NullableString"
        askedByUserId: { type: string, minLength: 1 }
        questionTitle: { type: string, minLength: 1 }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    CourseAnswerCreatedPayload:
      type: object
      additionalProperties: false
      required: [eventId, answerId, questionId, courseId, questionAuthorId, parentAnswerAuthorId, answeredByUserId, occurredAt]
      properties:
        eventId: { type: string, minLength: 1 }
        answerId: { type: string, minLength: 1 }
        questionId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        questionAuthorId: { type: string, minLength: 1 }
        parentAnswerAuthorId:
          $ref: "#/components/schemas/NullableString"
        answeredByUserId: { type: string, minLength: 1 }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    SubtitleGenerateRequestedPayload:
      type: object
      additionalProperties: false
      required: [jobId, courseId, lessonId, videoFileKey, targetLanguageCode, displayName, expectedOutputFileKey]
      properties:
        jobId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        lessonId: { type: string, minLength: 1 }
        videoFileKey: { type: string, minLength: 1 }
        targetLanguageCode: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        expectedOutputFileKey: { type: string, minLength: 1 }

    SubtitleTranslateRequestedPayload:
      type: object
      additionalProperties: false
      required:
        - jobId
        - courseId
        - lessonId
        - videoFileKey
        - sourceSubtitleId
        - sourceLanguageCode
        - sourceFileKey
        - sourceFileUrl
        - targetLanguageCode
        - displayName
        - expectedOutputFileKey
      properties:
        jobId: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        lessonId: { type: string, minLength: 1 }
        videoFileKey: { type: string, minLength: 1 }
        sourceSubtitleId: { type: string, minLength: 1 }
        sourceLanguageCode: { type: string, minLength: 1 }
        sourceFileKey: { type: string, minLength: 1 }
        sourceFileUrl: { type: string, minLength: 1 }
        targetLanguageCode: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        expectedOutputFileKey: { type: string, minLength: 1 }

    UserInstructorVerifiedPayload:
      type: object
      additionalProperties: false
      required: [userId, role, to, subject, body]
      properties:
        userId: { type: string, minLength: 1 }
        role: { type: string, enum: [INSTRUCTOR] }
        to: { type: string, format: email }
        subject: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }

    UserInstructorRejectedPayload:
      type: object
      additionalProperties: false
      required: [userId, to, subject, body]
      properties:
        userId: { type: string, minLength: 1 }
        to: { type: string, format: email }
        subject: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }

    UserInstructorTerminatedPayload:
      type: object
      additionalProperties: false
      required: [userId, to, subject, body]
      properties:
        userId: { type: string, minLength: 1 }
        to: { type: string, format: email }
        subject: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }

    UserInstructorPendingPayload:
      type: object
      additionalProperties: false
      required: [userId, userIds, title, message, instructorEmail]
      properties:
        userId: { type: string, minLength: 1 }
        userIds:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        instructorEmail: { type: string, format: email }

    UserInstructorApplicationSubmittedPayload:
      type: object
      additionalProperties: false
      required: [eventId, userId, email, cvUrl, submittedAt]
      properties:
        eventId:
          type: string
          minLength: 1
          description: Payload-local ID currently generated independently from the standard eventId header.
        userId: { type: string, minLength: 1 }
        email: { type: string, format: email }
        cvUrl: { type: string }
        submittedAt:
          $ref: "#/components/schemas/Timestamp"

    UserLearningProfileUpdatedPayload:
      type: object
      additionalProperties: false
      description: >-
        A snapshot (P1-06). Every answer may be null. With personalizationConsent false a consumer must not use the
        answers or the topics to personalize.
      required: [userId, categoryIds, personalizationConsent, occurredAt]
      properties:
        userId: { type: string, minLength: 1 }
        goal:
          oneOf:
            - type: string
              enum: [CAREER_START, SKILL_UP, CERTIFICATE, PERSONAL]
            - type: "null"
        level:
          oneOf:
            - type: string
              enum: [BEGINNER, BASIC, ADVANCED]
            - type: "null"
        minutesPerDay:
          oneOf:
            - type: integer
              enum: [15, 30, 45, 60, 90, 120]
            - type: "null"
        contentLanguage:
          oneOf:
            - type: string
              enum: [VI, EN, BOTH]
            - type: "null"
        categoryIds:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        personalizationConsent: { type: boolean }
        usageAnalyticsConsent:
          type: boolean
          description: >-
            The "Thống kê sử dụng" switch (P0-07). Added later, so an older producer may leave it out; a consumer
            reads a missing value as true. With false, reporting drops the learner's product events.
        occurredAt:
          $ref: "#/components/schemas/Timestamp"

    UserPreferenceUpdatedPayload:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [userId, categoryIds]
          properties:
            userId: { type: string, minLength: 1 }
            categoryIds:
              type: array
              uniqueItems: true
              items: { type: string, minLength: 1 }

    UserProfileOnboardedPayload:
      type: object
      additionalProperties: false
      required: [userId, keycloakSubject, email]
      properties:
        userId: { type: string, minLength: 1 }
        keycloakSubject: { type: string, minLength: 1 }
        email:
          $ref: "#/components/schemas/NullableString"

    UserPolicyPublishedPayload:
      type: object
      additionalProperties: false
      required: [documentId, title, sourceType, sourceUrl, content, versionNumber, publishedAt]
      properties:
        documentId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        sourceType: { type: string, enum: [POLICY] }
        sourceUrl: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        versionNumber: { type: integer, minimum: 1 }
        publishedAt:
          $ref: "#/components/schemas/Timestamp"

    UserPolicyArchivedPayload:
      type: object
      additionalProperties: false
      required: [documentId, sourceType, sourceUrl, publishedAt]
      properties:
        documentId: { type: string, minLength: 1 }
        sourceType: { type: string, enum: [POLICY] }
        sourceUrl: { type: string, minLength: 1 }
        publishedAt:
          $ref: "#/components/schemas/Timestamp"

    SubtitleJobProgressPayload:
      type: object
      additionalProperties: false
      required: [jobId, progressPercent]
      properties:
        jobId: { type: string, minLength: 1 }
        progressPercent: { type: integer, minimum: 0, maximum: 99 }

    SubtitleJobCompletedPayload:
      type: object
      additionalProperties: false
      required:
        - jobId
        - outputFileKey
        - outputFileUrl
        - fileName
        - fileType
        - fileSize
        - languageCode
        - displayName
        - wordConfidenceFileKey
        - wordConfidenceFileUrl
      properties:
        jobId: { type: string, minLength: 1 }
        outputFileKey: { type: string, minLength: 1 }
        outputFileUrl: { type: string, minLength: 1 }
        fileName: { type: string, minLength: 1 }
        fileType: { type: string, enum: [text/vtt] }
        fileSize: { type: integer, format: int64, minimum: 1 }
        languageCode: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        wordConfidenceFileKey:
          $ref: "#/components/schemas/NullableString"
        wordConfidenceFileUrl:
          $ref: "#/components/schemas/NullableString"
        quality:
          $ref: "#/components/schemas/SubtitleQualityReport"

    SubtitleQualityReport:
      type: object
      description: >-
        Optional (workers before it send none). Summary numbers only, never subtitle text; learning stores it
        on the track for the instructor's review and drops one larger than 8 KB.
      required: [schemaVersion, thresholds, metrics, warnings]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        thresholds:
          type: object
          properties:
            maxLineChars: { type: integer }
            maxLines: { type: integer }
            maxCps: { type: number }
            minSeconds: { type: number }
        metrics:
          type: object
          description: Cue count, CPS percentiles and over-limit share, line length, durations, overlaps, cues starting backwards, orphan cues.
        doubtfulWordShare:
          description: Share of recognised words below confidence 0.5; generate jobs only.
          oneOf:
            - type: number
            - type: "null"
        languageProbability:
          description: The ASR's confidence in the detected language; generate jobs only.
          oneOf:
            - type: number
            - type: "null"
        warnings:
          type: array
          items:
            type: string
            enum: [CPS_HIGH, LINE_TOO_LONG, CUE_TOO_SHORT, OVERLAP, LOW_CONFIDENCE, LANGUAGE_UNCERTAIN]

    SubtitleJobFailedPayload:
      type: object
      additionalProperties: false
      required: [jobId, errorCode, errorMessage]
      properties:
        jobId: { type: string, minLength: 1 }
        errorCode: { type: string, minLength: 1 }
        errorMessage: { type: string, maxLength: 4000 }

    AssistantActionDecidedPayload:
      type: object
      additionalProperties: false
      description: An action the assistant proposed reached its final state; the user is told it was done or not.
      required: [pendingActionId, type, status, actorUserId, occurredAt]
      properties:
        pendingActionId: { type: string, minLength: 1 }
        type: { type: string, minLength: 1, description: "Action type, for example learning_path.create." }
        status: { type: string, enum: [EXECUTED, FAILED, REJECTED, EXPIRED] }
        actorUserId: { type: string, minLength: 1, description: The user the agent acted for. }
        decidedBy: { type: [string, "null"], description: The approver; null when the action expired. }
        sessionId: { type: [string, "null"] }
        errorCode: { type: [string, "null"] }
        occurredAt:
          $ref: "#/components/schemas/Timestamp"
