    address: auth.authorization.changed
    servers:
      - $ref: "#/servers/rabbitmq"
    messages:
      AuthAuthorizationChanged:
        $ref: "#/components/messages/AuthAuthorizationChanged"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth.events.exchange
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: "0.3.0"
    x-delivery: at-least-once
    x-compatibility: new-v2-full-snapshot
    x-producer:
      service: auth
      implementation: com.cinx.auth.identity.infrastructure.messaging.IdentityEventPublisher
    x-consumers:
      - { service: notification, queue: notification.auth.queue, bindingKey: auth.# }
      - { service: reporting, queue: reporting.auth.queue, bindingKey: auth.# }
      - { service: commerce, queue: commerce.auth-authorization.queue, bindingKey: auth.authorization.changed }

