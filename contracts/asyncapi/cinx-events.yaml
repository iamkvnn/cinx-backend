asyncapi: 3.0.0
id: urn:cinx:contracts:domain-events
info:
  title: CINX Domain Events
  version: 2.0.0
  description: |
    Machine-readable RabbitMQ contracts shared by CINX deployables.
    Channel addresses are AMQP routing keys; the AMQP channel binding names the exchange.
  tags:
    - name: auth
      description: Identity lifecycle events.
    - name: commerce
      description: Order and wishlist events.
    - name: learning
      description: Catalog, entitlement, notification, community and subtitle request events.
    - name: user
      description: Profile, preference, policy and instructor lifecycle events.
    - name: subtitle-ai
      description: Subtitle worker result events.
    - name: assistant
      description: Outcomes of actions the AI assistant proposed.
defaultContentType: application/json

servers:
  rabbitmq:
    host: "{hostname}:{port}"
    pathname: /
    protocol: amqp
    protocolVersion: "0-9-1"
    description: CINX RabbitMQ broker. Runtime credentials and host values come from service configuration.
    variables:
      hostname:
        default: rabbitmq
        description: RabbitMQ host visible to the running service.
      port:
        default: "5672"
        description: RabbitMQ AMQP port.
    security:
      - $ref: "#/components/securitySchemes/rabbitCredentials"

x-known-runtime-drift:
  - id: java-local-date-time-offset
    channels:
      - learning.enrollment.granted
      - learning.course.sellability.changed
      - course.course.published
      - course.course.updated
      - course.course.archived
      - user.instructor.application.submitted
      - user.policy.published
      - user.policy.archived
    description: Several Java publishers serialize LocalDateTime without an offset although the contract timestamp format is RFC 3339 date-time.
channels:
