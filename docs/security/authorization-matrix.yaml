        path: /api/v1/assistant/sessions
      - method: GET
        path: /api/v1/assistant/sessions/{sessionId}/messages
      - method: DELETE
        path: /api/v1/assistant/sessions/{sessionId}
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.agent.use.learner, assistant.agent.use.instructor, assistant.agent.use.admin]
      relationship: session-owner
      attributes: []
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: none

  - id: assistant.pending-action-decide
    owner: assistant
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/assistant/pending-actions
      - method: GET
        path: /api/v1/assistant/pending-actions/{actionId}
      - method: POST
        path: /api/v1/assistant/pending-actions/{actionId}/approve
      - method: POST
        path: /api/v1/assistant/pending-actions/{actionId}/reject
      - method: PATCH
        path: /api/v1/assistant/pending-actions/{actionId}
      - method: GET
        path: /api/v1/assistant/pending-actions/{actionId}/revisions
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.action.approve.self]
      relationship: action-actor-or-approver
      attributes:
        - a self action is visible to and decided only by the user it was proposed for, with assistant.action.approve.self
        - a permission action is visible to and decided by holders of its approver permission
        - an action marked requiresMfa needs a step-up token from the approver (403 MFA_STEP_UP_REQUIRED)
        - the write runs with a token exchanged from the approver's token; the target service re-checks authorization
        - the version shown must match (409 CONFLICT); expired or decided actions are 409
        - PATCH edits a pending draft and is allowed only to the user it was proposed for; it bumps the version and the idempotency key
        - revisions list the draft's payload at every version, to the same people who can see the action
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: security

  - id: assistant.pending-action-draft
    owner: assistant
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/assistant/pending-actions
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.agent.use.learner]
      relationship: self
      attributes:
        - the learner starts a learning_path.create or learning_path.replace_items draft by hand; no model runs and no credit is spent
        - the draft is a self action of the caller; a sessionId must be the caller's own session (else 404), without one a new session is opened
        - nothing reaches learning until the caller approves the draft
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: security

  - id: assistant.instructor-course-tools
    owner: assistant
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/assistant/instructor/courses/{courseId}/materials
      - method: GET
        path: /api/v1/assistant/instructor/courses/{courseId}/materials
      - method: DELETE
        path: /api/v1/assistant/instructor/courses/{courseId}/materials/{materialId}
      - method: POST
        path: /api/v1/assistant/instructor/courses/{courseId}/practice-jobs
      - method: GET
        path: /api/v1/assistant/instructor/courses/{courseId}/practice-jobs
      - method: GET
        path: /api/v1/assistant/instructor/practice-jobs/{jobId}
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.agent.use.instructor]
      relationship: course-instructor-unless-any
      attributes:
        - learning confirms the caller is an editor, manager or owner of the course (GET /api/v1/learning/instructor/courses/{id}) before anything is read or written
        - a material is a file uploaded through learning's course presigned URL; its text is indexed for that course only
        - a practice job proposes quiz.add_question actions in its own session; nothing reaches the quiz until each is approved
        - practice jobs spend assistant.instructor.credits; when they run out the job stops and keeps what it made
      entitlement: null
      quota:
        type: reservation
        quotaKey: assistant.instructor.credits
        units: server-calculated
        reserveBeforeSideEffect: true
        commitOnSuccess: true
        releaseOnSafeFailure: true
    concealUnauthorizedResource: true
    audit: security

  - id: assistant.memory-self
    owner: assistant
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/assistant/memory-consent
      - method: PUT
        path: /api/v1/assistant/memory-consent
      - method: DELETE
        path: /api/v1/assistant/memory-consent
      - method: GET
        path: /api/v1/assistant/memories
      - method: PATCH
        path: /api/v1/assistant/memories/{memoryId}
      - method: DELETE
        path: /api/v1/assistant/memories/{memoryId}
      - method: DELETE
        path: /api/v1/assistant/memories
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.agent.use.learner]
      relationship: self
      attributes:
        - a memory is saved only by approving a memory.save pending action, and only while consent is granted
        - withdrawing consent deletes every memory of the caller
        - contact and payment details are refused (400 MEMORY_SENSITIVE); at most 50 memories
        - a memory unused in any turn for twelve months is deleted
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: security

  - id: assistant.answer-report-self
