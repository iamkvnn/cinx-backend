$schema: ./authorization-matrix.schema.json
schemaVersion: "1.0"
status: proposed
lastReviewed: "2026-07-31"
owners:
  securityModel: auth
  operationPolicy: owning-service

coverage:
  current: critical-boundaries-and-target-subscription-flows
  releaseRequirement: every-public-internal-websocket-and-provider-operation
  rule: >
    A route not represented by an operation or an explicitly referenced
    operation family is not ready for release.

defaults:
  decision: deny
  principalClaim: sub
  requiredClaimsForOrdinaryUserOperations:
    - sub
  userAudience: cinx-api
  userTokenKind: user
  serviceTokenKind: service
  missingAttributeDecision: deny
  malformedClaimDecision: deny
  unauthenticatedStatus: 401
  forbiddenStatus: 403
  concealedResourceStatus: 404
  quotaExceededStatus: 429
  mfaPolicy:
    requiredAcr: urn:cinx:loa:2
    allowedAmr: [otp, hwk, webauthn]
    maxAuthAgeSeconds: 900
    insufficientCode: MFA_STEP_UP_REQUIRED
  ownershipRule: >
    A self or own permission never proves ownership. The owning service
    resolves the relationship from its own database or trusted projection.
  commercialRule: >
    Roles and permissions never encode a plan. Feature entitlement and quota
    are evaluated after authentication and security authorization.

routeEncoding:
  method: >
    Uppercase HTTP method. Multiple methods in one policy use a pipe-separated
    scalar such as GET|POST; the validator must split it before matching.
  path: >
    Spring-style path variables use {name}; /** is a family wildcard.
  matchRule: >
    A concrete controller method must match exactly one operation. Zero or
    multiple matches fail validation; there is no most-specific-policy
    precedence.
  schemaValidation: required-before-implementation-complete

authorityMapping:
  roles:
    claim: roles
    prefix: ROLE_
  permissions:
    claim: permissions
    prefix: PERM_
  oauthScopes:
    claim: scope
    prefix: SCOPE_
  notes:
    - ROLE_* and PERM_* definitions come from the canonical authorization catalog.
    - Keycloak realm composites are generated or validated from that catalog.
    - User-to-role grants and account status are authored in the auth database.
    - SCOPE_* is OAuth protocol scope, not a replacement for application permission.

policyCheckTypes:
  relationship:
    - self
    - self-or-any
    - self-and-notification-owner
    - order-owner-or-any
    - course-instructor-unless-any
    - active-course-membership
    - course-instructor-or-learner
    - submission-course-instructor
    - course-team-member
    - session-owner
    - authenticated-user-destination
  resourceAttribute:
    - published
    - preview
    - active
    - workflow-state
    - account-state
  entitlement:
    - feature-grant
    - course-access
  quota:
    - hard-counter
    - reservation

operations:
  - id: auth.account-read-any
    owner: auth
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/identity/accounts/{userId}
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [auth.account.read.any]
      relationship: null
      attributes: []
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: security

  - id: auth.account-suspend-any
    owner: auth
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/identity/accounts/{userId}/suspend
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [auth.account.suspend.any]
      relationship: null
      attributes:
        - valid account-state transition
        - break-glass and last-admin protections apply
      entitlement: null
      quota: null
    audit: security-critical

  - id: auth.account-reactivate-any
    owner: auth
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/identity/accounts/{userId}/reactivate
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [auth.account.reactivate.any]
      relationship: null
      attributes:
        - valid account-state transition
        - break-glass and last-admin protections apply
      entitlement: null
      quota: null
    audit: security-critical

  - id: auth.role-assign-any
    owner: auth
    transport: http
    exposure: user
    routes:
      - method: PUT
        path: /api/v1/identity/accounts/{userId}/roles
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [auth.role.assign.any]
      relationship: null
      attributes:
        - requested roles are application roles from the allowlist
        - caller cannot grant a role outside its delegation policy
        - assignment expiry and reason are validated
      entitlement: null
      quota: null
    audit: security-critical

  - id: auth.permission-members-internal
    owner: auth
    transport: http
    exposure: internal
    routes:
      - method: GET
        path: /internal/identity/permissions/{permission}/user-ids
    authentication:
      required: true
      tokenKind: service
      audiences: [cinx-auth-internal]
      allowedClients:
        - cinx-notification-service
    authorization:
      permissionsAll: [auth.internal.permission-members.read]
      relationship: null
      attributes:
        - requested permission is in the notification-recipient allowlist
      entitlement: null
      quota: null
    audit: security

  - id: auth.authorization-state-internal
    owner: auth
    transport: http
    exposure: internal
    routes:
      - method: GET
        path: /internal/identity/accounts/{userId}/authorization-state
    authentication:
      required: true
      tokenKind: service
      audiences: [cinx-auth-internal]
      allowedClients:
        - cinx-gateway-service
        - cinx-user-service
        - cinx-commerce-service
        - cinx-learning-service
        - cinx-notification-service
        - cinx-reporting-service
        - cinx-recommendation-service
        - cinx-assistant-service
    authorization:
      permissionsAll: [auth.internal.authorization-state.read]
      relationship: null
      attributes:
        - response is the minimal status, roles and monotonic authorization version for one user
        - caller uses it only for revocation or plan-eligibility projection rehydration
      entitlement: null
      quota: null
    audit: security

  - id: user.profile-onboard-self
    owner: user
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/profiles/me/onboarding
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      requiredClaims: [sub]
    authorization:
      permissionsAll: []
      relationship: self
      attributes:
        - this is the only permissionless authenticated onboarding exception
        - identity is derived from sub; the first token already carries LEARNER
        - body cannot select or grant an authorization role
        - instructor application is stored as workflow state
        - acceptedPolicyIds must be published policies and cover each published TERMS and PRIVACY type; the agreement is stored in policy_acceptance
        - preferredCategoryIds are published as the user.preference.updated event for the new profile only
        - the optional learningProfile (goal, level, minutesPerDay, contentLanguage) and the topics are stored as the learner's learning profile; an empty learningProfile records the step as skipped
      entitlement: null
      quota: null
    idempotency:
      required: true
      key: authenticated-user-and-request-fingerprint
    audit: business

  - id: user.learning-profile-self
    owner: user
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/profiles/me/learning-profile
      - method: PUT
        path: /api/v1/profiles/me/learning-profile
      - method: POST
        path: /api/v1/profiles/me/learning-profile/skip
      - method: PUT
        path: /api/v1/profiles/me/preferred-categories
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAny: [user.profile.read.self, user.profile.update.self]
      relationship: self
      attributes:
        - GET needs user.profile.read.self; PUT, skip and preferred-categories need user.profile.update.self; the profile is always the JWT subject's own
        - minutesPerDay is one of 15, 30, 45, 60, 90, 120; at most 20 topics; a write publishes user.learning-profile.updated, and user.preference.updated when the topics changed
        - personalizationConsent false means no service may use the profile to personalize; the learner's own study-plan form may still be pre-filled from it
        - the assistant reads GET with the learner's exchanged token (audience cinx-api)
      entitlement: null
      quota: null
    audit: none

  - id: user.profile-read-self
    owner: user
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/profiles/me
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [user.profile.read.self]
      relationship: self
      attributes: []
      entitlement: null
      quota: null
    audit: none

  - id: user.profile-avatar-upload-self
    owner: user
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/profiles/upload/presigned-url
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [user.profile.update.self]
      relationship: self
      attributes:
        - only image/png, image/jpeg and image/webp are signed; any other contentType answers 400
        - the object key is generated by the service under avatars/, never chosen by the caller
      entitlement: null
      quota: null
    audit: none

  - id: user.profile-read-any
    owner: user
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/admin/profiles/{userId}
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [user.profile.read.any]
      relationship: null
      attributes:
        - response fields are reduced for non-self callers
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: conditional

  - id: user.instructor-apply-self
    owner: user
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/instructor-applications
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [user.instructor.apply.self]
      relationship: self
      attributes:
        - no active or pending application exists
        - account is active
      entitlement: null
      quota: null
    audit: business

  - id: user.instructor-review-any
    owner: user
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/instructor-applications/{applicationId}/approve
      - method: POST
        path: /api/v1/instructor-applications/{applicationId}/reject
      - method: POST
        path: /api/v1/instructor-partnerships/{userId}/terminate
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [user.instructor.review.any]
      relationship: null
      attributes:
        - valid workflow-state transition
        - approval requests an INSTRUCTOR grant through auth
      entitlement: null
      quota: null
    audit: security-critical

  - id: user.profile-read-internal
    owner: user
    transport: http
    exposure: internal
    routes:
      - method: GET
        path: /internal/users/{userId}
      - method: GET
        path: /internal/user-ids
      - method: GET
        path: /internal/users/{userId}/instructor-verified
      - method: GET
        path: /internal/users/instructor-lookup
    authentication:
      required: true
      tokenKind: service
      audiences: [cinx-user-internal]
      allowedClients:
        - cinx-learning-service
        - cinx-notification-service
    authorization:
      permissionsAll: [user.internal.profile.read]
      relationship: null
      attributes:
        - response fields follow the caller-specific internal contract
        - instructor-lookup answers one verified, non-terminated instructor for an exact email, else 404 (no directory)
      entitlement: null
      quota: null
    audit: service

  - id: user.policy-public-read
    owner: user
    transport: http
    exposure: public
    routes:
      - method: GET
        path: /api/v1/policies/{slug}
    authentication:
      required: false
    authorization:
      permissionsAll: []
      relationship: null
      attributes:
        - policy version is published
      entitlement: null
      quota: null
    audit: none

  - id: user.policy-manage-any
    owner: user
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/policies
      - method: PUT
        path: /api/v1/policies/{policyId}
      - method: POST
        path: /api/v1/policies/{policyId}/archive
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [user.policy.manage.any]
      relationship: null
      attributes:
        - valid workflow-state transition
      entitlement: null
      quota: null
    audit: business

  - id: user.policy-publish-any
    owner: user
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/policies/{policyId}/publish
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [user.policy.publish.any]
      relationship: null
      attributes:
        - valid workflow-state transition
      entitlement: null
      quota: null
    audit: business-critical

  - id: commerce.cart-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET|POST|DELETE
        path: /api/v1/cart/**
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.cart.manage.self]
      relationship: self
      attributes:
        - userId is derived from the token
        - adding a course in one of the caller's paid orders is refused (COURSE_ALREADY_OWNED)
        - items carry sellable and owned flags
      entitlement: null
      quota: null
    audit: none

  - id: commerce.wishlist-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET|POST|DELETE
        path: /api/v1/wishlist/**
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.wishlist.manage.self]
      relationship: self
      attributes:
        - userId is derived from the token
      entitlement: null
      quota: null
    audit: none

  - id: commerce.order-create-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/orders
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.order.create.self]
      relationship: self
      attributes:
        - sellability and price are loaded from trusted local projections
        - totals are calculated server-side
        - a course in one of the caller's paid orders is refused (COURSE_ALREADY_OWNED)
        - a zero total is paid at creation and writes CommerceOrderPaid in the same transaction
      entitlement: null
      quota: null
    idempotency:
      required: true
      header: Idempotency-Key
      fingerprintRequired: true
    audit: financial

  - id: commerce.order-cancel-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/orders/{orderId}/cancel
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.order.create.self]
      relationship: order-owner
      attributes:
        - only a PENDING order, under a row lock shared with the payment callback
        - the voucher redemption stays consumed
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: financial

  - id: commerce.order-payment-link-create-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/orders/{orderId}/payments
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.order.create.self]
      relationship: order-owner
      attributes:
        - only a PENDING order, under the same row lock as the payment webhooks
        - the amount sent to the gateway is the stored order total, never a client value
        - a gateway without configured keys, or that cannot take the amount, is refused
        - a live link for the same order and gateway is reused instead of issuing another
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: financial

  - id: commerce.order-read
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/orders/{orderId}
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAny:
        - commerce.order.read.self
        - commerce.order.read.any
      relationship: order-owner-or-any
      attributes: []
      entitlement: null
      quota: null
    concealUnauthorizedResource: true
    audit: conditional

  - id: commerce.voucher-manage-any
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET|POST
        path: /api/v1/vouchers
      - method: GET|PUT
        path: /api/v1/vouchers/{code}
      - method: PATCH
        path: /api/v1/vouchers/{code}/active
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.voucher.manage.any]
      relationship: null
      attributes: []
      entitlement: null
      quota: null
    audit: financial

  - id: commerce.voucher-preview-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/vouchers/{code}/preview
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: []
      relationship: self
      attributes:
        - eligibility is calculated for the authenticated user and current cart
        - inactive or non-applicable vouchers do not expose another user context
      entitlement: null
      quota: null
    audit: none

  - id: commerce.plan-public-read
    owner: commerce
    transport: http
    exposure: public
    routes:
      - method: GET
        path: /api/v1/plans
      - method: GET
        path: /api/v1/plans/{planCode}
    authentication:
      required: false
    authorization:
      permissionsAll: []
      relationship: null
      attributes:
        - only active published plan versions and saleable offers are returned
        - customer-segment filters are display filters and never prove checkout eligibility
        - the response adds the translated name and description, the offers' price, the saleable features and a purchasable flag; features that are not saleable are never listed
      entitlement: null
      quota: null
    audit: none

  - id: commerce.plan-manage-any
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET|POST|PUT|PATCH
        path: /api/v1/admin/plans/**
      - method: GET|POST|PUT|PATCH
        path: /api/v1/admin/plan-product-lines/**
      - method: GET|PUT
        path: /api/v1/admin/plan-system-bindings/**
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [commerce.plan.manage.any]
      relationship: null
      attributes:
        - published plan versions are immutable
        - feature keys exist in the feature registry
        - eligibility and billing-policy keys exist in reviewed registries
        - product-line eligibility and subscription slot are immutable once published
        - plan entitlements cannot encode auth.*, ROLE_*, PERM_* or SCOPE_* values
        - VND amounts have no fractional unit and provider references are server-created
        - a version is not saleable until provider Product and Price references reconcile
        - system bindings are audited data and never cause a role or permission mutation
      entitlement: null
      quota: null
    audit: financial

  - id: commerce.subscription-read-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: GET
        path: /api/v1/subscriptions/me
      - method: GET
        path: /api/v1/entitlements/me
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.subscription.read.self]
      relationship: self
      attributes: []
      entitlement: null
      quota: null
    audit: none

  - id: commerce.subscription-change-self
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/subscriptions/checkout-sessions
      - method: POST
        path: /api/v1/subscriptions/me/change
      - method: POST
        path: /api/v1/subscriptions/me/cancel
      - method: POST
        path: /api/v1/subscriptions/me/resume
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: [commerce.subscription.change.self]
      relationship: self
      attributes:
        - authenticated account is ACTIVE
        - requested offer is active and server resolves amount, currency and provider price
        - plan eligibility policy is satisfied by current auth state
        - VERIFIED_INSTRUCTOR requires the pre-existing INSTRUCTOR role
        - eligibility is rechecked before provider-confirmed activation
        - a subscription command cannot request, grant or revoke an authorization role
        - v1 accepts only USER subjects and one current BASE subscription slot
        - transition follows subscription state machine
      entitlement: null
      quota: null
    idempotency:
      required: true
      header: Idempotency-Key
      fingerprintRequired: true
    audit: financial

  - id: commerce.subscription-adjust-any
    owner: commerce
    transport: http
    exposure: user
    routes:
      - method: POST
        path: /api/v1/admin/subscriptions/{subscriptionId}/adjust
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api]
      mfaRequired: true
    authorization:
      permissionsAll: [commerce.subscription.adjust.any]
      relationship: null
      attributes:
        - adjustment reason and expiry are required
        - provider state is reconciled where applicable
        - adjustment cannot bypass plan eligibility or mutate authorization roles
      entitlement: null
      quota: null
    audit: financial-critical

  - id: commerce.billing-provider-webhook
    owner: commerce
    transport: http
    exposure: provider
    routes:
      - method: POST
        path: /api/v1/billing/webhooks/{provider}
    authentication:
      required: true
      mechanism: provider-signature
      rawBodyRequired: true
      timestampAndReplayWindowRequired: true
      providerAllowlistRequired: true
    authorization:
      permissionsAll: []
      relationship: null
      attributes:
        - v1 billing provider allowlist contains exactly STRIPE
        - provider event ID is durably deduplicated
        - stale provider object versions cannot regress state
        - plan eligibility is rechecked before paid entitlement activation
        - browser redirect is never proof of payment
      entitlement: null
      quota: null
    audit: financial-critical

  - id: commerce.order-payment-provider-webhook
    owner: commerce
    transport: http
    exposure: provider
    routes:
      - method: POST
        path: /api/v1/payments/webhooks/stripe
      - method: POST
        path: /api/v1/payments/webhooks/momo
      - method: GET
        path: /api/v1/payments/webhooks/vnpay
    authentication:
      required: true
      mechanism: provider-signature
      rawBodyRequired: true
      timestampAndReplayWindowRequired: true
      providerAllowlistRequired: true
    authorization:
      permissionsAll: []
      relationship: null
      attributes:
        - this is the one-time order-payment webhook boundary; the removed generic callback endpoint is gone
        - only the three listed gateways exist, each with its own route and signature scheme (Stripe HMAC with a timestamp window, MoMo HMAC-SHA256, VNPay HMAC-SHA512)
        - MoMo and VNPay carry no timestamp, so replay is stopped by the durable (provider, event ID) deduplication and by the attempt and order state
        - the order is found through a payment attempt this service issued, never through a client-supplied order ID
        - the attempt amount, the order total and the paid amount must all be equal
        - Stripe sessions are fetched again by ID before they count as paid
        - browser redirect is never proof of payment
      entitlement: null
      quota: null
    audit: financial-critical

  - id: commerce.entitlement-read-internal
    owner: commerce
    transport: http
    exposure: internal
    routes:
      - method: GET
        path: /internal/entitlements/users/{userId}
    authentication:
      required: true
      tokenKind: service
      audiences: [cinx-commerce-internal]
      allowedClients:
        - cinx-learning-service
        - cinx-recommendation-service
