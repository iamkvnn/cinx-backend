releaseChecks:
  - Every controller route and WebSocket destination maps to exactly one operation or family.
  - Public operations prove that protected fields and content are excluded.
  - Every .self or .own permission has an owning-service relationship test.
  - Every internal operation validates service token kind, exact audience, client and permission.
  - Every commercial feature has both entitlement-allowed and entitlement-denied tests.
  - Every metered feature tests duplicate requests, concurrency and reservation recovery.
  - Provider callbacks test signature failure, replay, duplicate and out-of-order events.
