  - id: assistant.agent-chat
    owner: assistant
    transport: http-sse
    exposure: user
    routes:
      - method: POST
        path: /api/v1/assistant/chat
      - method: GET
        path: /api/v1/assistant/capabilities
    authentication:
      required: true
      tokenKind: user
      audiences: [cinx-api, cinx-assistant]
    authorization:
      permissionsAny: [assistant.agent.use.learner, assistant.agent.use.instructor, assistant.agent.use.admin]
      relationship: session-owner
      attributes:
        - the placement picks the persona; the matching assistant.agent.use.<persona> permission is required
        - each capability adds its own permissions; a capability the caller lacks is not offered to the model
        - the current AI policy version must be accepted (403 AI_POLICY_NOT_ACCEPTED)
        - tools call domain services with a token exchanged for that service, never the caller's own token
        - access needs AI credits left; recommendation.agent.advanced is not checked (Learner Free has it off but has credits)
        - each capability also has a daily turn cap that guards against abuse
        - an instructor placement spends assistant.instructor.credits instead of the learner credits
        - an admin placement is not metered (no credits, no daily cap, plan GĐ3-a); every admin tool call is written to admin_tool_audit
        - admin tools that read MFA-gated data (reports, reporting) require the caller's own fresh MFA, then read through /internal
        - an optional tutor mode (EXPLAIN, GIVE_HINT, CHECK_UNDERSTANDING) is accepted only with placement lesson_player (else 400 MODE_NOT_ALLOWED) and pins learner.lesson_tutor
      entitlement: null
      quota:
        type: reservation
        quotaKey: recommendation.agent.requests
        units: credits (1,000 tokens weighted per model), metered from real model usage
        reserveBeforeSideEffect: true
        commitOnSuccess: true
        releaseOnSafeFailure: true
      entitlementFailureCode: FEATURE_NOT_ENTITLED
      quotaFailureCode: QUOTA_EXCEEDED
    idempotency:
      required: true
      header: Idempotency-Key
      fingerprintRequired: true
    audit: metered

  - id: assistant.session-self
    owner: assistant
    transport: http
    exposure: user
    routes:
