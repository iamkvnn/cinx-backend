        path: /api/v1/courses/{courseId}/lessons/{lessonId}/**
    authentication:
      required: conditional
      tokenKind: user
      audiences: [cinx-api]
    authorization:
      permissionsAll: []
      relationship: course-instructor-or-learner
      attributes:
        - preview content may be anonymous
        - a preview lesson of a published course is open to everyone, including signed-in non-buyers; the learning chain permits GET .../videos and .../articles anonymously for this
        - normal content requires published and available course state
        - a learner is refused (403 LESSON_LOCKED, missingPrerequisiteIds) until every published prerequisite is done; done = completed progress, a submitted quiz session (SUBMITTED, GRADED, PENDING_GRADE) or an assignment submission; previews, admins and course members are not locked
        - an AI subtitle track waiting for review (REVIEW_REQUIRED) is listed, and its .../content and .../word-confidence answered, only for someone who can manage the course; anyone else gets it left out or 404
      entitlement:
        type: course-access
        acceptedSources:
          - permanent-purchase-grant
          - active-subscription-feature-grant
          - explicit-admin-grant
          - preview
          - course-owner
      quota: null
    concealUnauthorizedResource: false
    audit: conditional

