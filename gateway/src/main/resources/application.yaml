spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: openapi-auth
            uri: lb://auth
            predicates:
            - Path=/v3/api-docs/auth
            filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs
          - id: openapi-commerce
            uri: lb://commerce
            predicates:
            - Path=/v3/api-docs/commerce
            filters:
            - RewritePath=/v3/api-docs/commerce, /v3/api-docs
          - id: openapi-user
            uri: lb://user
            predicates:
            - Path=/v3/api-docs/user
            filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
          - id: openapi-learning
            uri: lb://learning
            predicates:
            - Path=/v3/api-docs/learning
            filters:
            - RewritePath=/v3/api-docs/learning, /v3/api-docs
          - id: openapi-notification
            uri: lb://notification
            predicates:
            - Path=/v3/api-docs/notification
            filters:
            - RewritePath=/v3/api-docs/notification, /v3/api-docs
          - id: openapi-reporting
            uri: lb://reporting
            predicates:
            - Path=/v3/api-docs/reporting
            filters:
            - RewritePath=/v3/api-docs/reporting, /v3/api-docs
          - id: openapi-assistant
            uri: ${assistant.base-url}
            predicates:
            - Path=/v3/api-docs/assistant
            filters:
            - RewritePath=/v3/api-docs/assistant, /openapi.json
          - id: identity-service-v2
            uri: lb://auth
            predicates:
            - Path=/api/v1/identity/**
          - id: commerce-service-v2
            uri: lb://commerce
            predicates:
            - Path=/api/v1/cart/**,/api/v1/wishlist/**,/api/v1/orders/**,/api/v1/vouchers/**,/api/v1/payments/**,/api/v1/plans/**,/api/v1/subscriptions/**,/api/v1/entitlements/**,/api/v1/billing/**,/api/v1/admin/plans/**,/api/v1/admin/subscriptions/**
          - id: user-profile-v2
            uri: lb://user
            predicates:
            - Path=/api/v1/profiles/**,/api/v1/admin/profiles/**,/api/v1/policies/**,/api/v1/instructor-applications/**,/api/v1/instructor-partnerships/**,/api/v1/users/**
          - id: keycloak
            uri: ${keycloak.base-url}
            predicates:
            - Path=/realms/**,/resources/**
          - id: learning-service
            uri: lb://learning
            predicates:
            - Path=/api/v1/courses/**,/api/v1/instructors/**,/api/v1/admin/courses/**,/api/v1/admin/lab-reviews/**,/api/v1/enrollments/**,/api/v1/learning/**,/api/v1/assessments/**,/api/v1/community/**,/api/v1/certificates/**
          - id: notification-service
            uri: lb://notification
            predicates:
            - Path=/api/v1/notifications/**
          - id: notification-websocket
            uri: lb:ws://notification
            predicates:
            - Path=/ws/**
          - id: notification-sockjs
            uri: lb://notification
            predicates:
            - Path=/sockjs/**
          - id: recommendation-service
            uri: ${recommendation.base-url}
            predicates:
            - Path=/api/v1/recommendations/**
          - id: assistant-service
            uri: ${assistant.base-url}
            predicates:
            - Path=/api/v1/assistant/**
          - id: campus-service
            uri: ${campus.base-url}
            predicates:
            - Path=/api/v1/campus/**
            # Colyseus answers CORS itself; keep one copy so browsers accept the response
            filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
          # Colyseus matchmaking (HTTP) and room sockets (WebSocket upgrade) under one prefix; campus authenticates the seat request itself
          - id: campus-realtime
            uri: ${campus.base-url}
            predicates:
            - Path=/campus/**
            filters:
            - RewritePath=/campus/?(?<segment>.*), /$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
          # a learner's machine: the terminal and file socket of an ENVIRONMENT lab, served by the runner at the same path; the ticket in the URL is the auth
          - id: lab-sessions
            uri: ${runner.base-url}
            predicates:
            - Path=/lab-sessions/**
            filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
          - id: reporting-service
            uri: lb://reporting
            predicates:
            - Path=/api/v1/reporting/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
security:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    audience: ${KEYCLOAK_AUDIENCE}
keycloak:
  base-url: ${KEYCLOAK_BASE_URL}
recommendation:
  base-url: http://${RECOMMENDATION_HOST}:${RECOMMENDATION_PORT}
assistant:
  base-url: http://${ASSISTANT_HOST:assistant}:${ASSISTANT_PORT:8092}
campus:
  base-url: http://${CAMPUS_HOST:campus}:${CAMPUS_PORT:2567}
runner:
  base-url: http://${RUNNER_HOST:runner}:${RUNNER_PORT:8094}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
server:
  port: 9090
management:
  # metrics stay off the public port: 9090 is published, the management port is not
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9190}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    # the search limit and the token-freshness check both fail open without Redis, so it must not mark the gateway down
    redis:
      enabled: false
cinx:
  rate-limit:
    key: ${GATEWAY_RATE_LIMIT_KEY:}
    trust-forwarded-for: ${GATEWAY_TRUST_FORWARDED_FOR:false}
    search:
      guest-per-minute: 30
      user-per-minute: 120
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
    - name: Auth Service
      url: /v3/api-docs/auth
    - name: Commerce Service
      url: /v3/api-docs/commerce
    - name: User Service
      url: /v3/api-docs/user
    - name: Learning Service
      url: /v3/api-docs/learning
    - name: Notification Service
      url: /v3/api-docs/notification
    - name: Reporting Service
      url: /v3/api-docs/reporting
    - name: Assistant Service
      url: /v3/api-docs/assistant
