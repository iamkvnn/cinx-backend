spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  cloud:
    discovery:
      enabled: false
  task:
    scheduling:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  keycloak:
    issuer-uri: http://localhost:8180/realms/cinx
    jwk-set-uri: http://localhost:8180/realms/cinx/protocol/openid-connect/certs
    audience: cinx-api

keycloak:
  base-url: http://localhost:8180
  realm: cinx
  admin:
    client-id: cinx-auth-admin
    client-secret: test

aws:
  region: us-east-1
  credentials:
    access-key: test
    secret-key: test
  s3:
    endpoint: http://localhost
    bucket: test-bucket
    cdn-url: https://cdn.example.test

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

google:
  token-uri: https://oauth2.example.test/token
  user-info-uri: https://oauth2.example.test/userinfo
  client-id: test
  client-secret: test

gateway:
  url: http://localhost

gateway.url: http://localhost
feBaseUrl: http://localhost

firebase:
