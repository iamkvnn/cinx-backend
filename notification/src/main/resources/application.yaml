spring:
  application:
    name: notification
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
security:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    audience: ${KEYCLOAK_AUDIENCE}
firebase:
  config-path: ${FIREBASE_CONFIG_PATH}
gateway.url: ${GATEWAY_URL}
server:
  port: 8086
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
cinx:
  security:
    authorization-freshness:
      token-uri: ${KEYCLOAK_SERVICE_TOKEN_URI:http://keycloak:8080/realms/cinx/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:cinx-notification-service}
      client-secret: ${CINX_NOTIFICATION_SERVICE_CLIENT_SECRET:}
