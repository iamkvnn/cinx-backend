spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: test
    password: test
  task:
    scheduling:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
    dynamic: false
    listener:
      simple:
        auto-startup: false
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
security:
  keycloak:
    issuer-uri: http://localhost:8180/realms/cinx
    jwk-set-uri: http://localhost:8180/realms/cinx/protocol/openid-connect/certs
    audience: cinx-api
