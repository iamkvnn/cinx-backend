services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
    - "3300:3306"
    networks:
    - cinx-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - ./env/dev/mysql.env
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - ./env/dev/rabbitmq.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  # the gateway's search rate-limit counters only; they live a minute, so nothing is persisted
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
    - "6379:6379"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  keycloak:
    image: cinx-keycloak:26.6.1
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloakdb
      KC_DB_USERNAME: root
      KC_HEALTH_ENABLED: "true"
    env_file:
      - ./env/dev/keycloak.env
    ports:
      - "8180:8080"
    networks:
      - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
  eureka-server:
    container_name: eureka-server
    ports:
    - "8761:8761"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    build: ./eureka
    image: cinx-eureka:local
  gateway:
    container_name: gateway
    ports:
    - "9090:9090"
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
      # started first, but not awaited healthy: the limit lets searches through while Redis is away
      redis:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/gateway.env
    build: ./gateway
    image: cinx-gateway:local
  auth:
    container_name: auth-service
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/auth.env
    build: ./auth
    image: cinx-auth:local
  learning:
    container_name: learning-service
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/learning.env
    build:
      context: .
      dockerfile: learning/Dockerfile
    image: cinx-learning:local
  user:
    container_name: user-service
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/user.env
    build: ./user
    image: cinx-user:local
networks:
  cinx-network:
    driver: bridge
    name: cinx-network

volumes:
  mysql-data:
  rabbitmq-data:
