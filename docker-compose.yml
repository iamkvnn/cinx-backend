services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
    - "3300:3306"
    networks:
    - cinx-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - ./env/dev/mysql.env
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - ./env/dev/rabbitmq.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  # the gateway's search rate-limit counters only; they live a minute, so nothing is persisted
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
    - "6379:6379"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  eureka-server:
    container_name: eureka-server
    ports:
    - "8761:8761"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    build: ./eureka
    image: cinx-eureka:local
  gateway:
    container_name: gateway
    ports:
    - "9090:9090"
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
      # started first, but not awaited healthy: the limit lets searches through while Redis is away
      redis:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/gateway.env
    build: ./gateway
    image: cinx-gateway:local
  auth:
    container_name: auth-service
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - ./env/dev/common.env
    - ./env/dev/auth.env
    build: ./auth
    image: cinx-auth:local
networks:
  cinx-network:
    driver: bridge
    name: cinx-network

volumes:
  mysql-data:
  rabbitmq-data:
