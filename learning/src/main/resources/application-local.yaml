spring:
  config:
    import: optional:file:../env/local.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3300}/learningdb
    username: root
    password: ${MYSQL_ROOT_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  # registered as localhost, so a laptop that changes networks does not leave the registry on an old IP
  instance:
    hostname: localhost
    prefer-ip-address: false
security:
  keycloak:
    issuer-uri: http://localhost:8180/realms/cinx
    jwk-set-uri: http://localhost:8180/realms/cinx/protocol/openid-connect/certs
    audience: cinx-api
gateway.url: http://localhost:9090
cinx:
  assistant:
    internal-base-url: ${ASSISTANT_INTERNAL_BASE_URL:http://localhost:8092}
  security:
    authorization-freshness:
      # on the host, Keycloak and auth answer on localhost; application.yaml defaults to their Docker names
      auth-base-url: ${AUTH_INTERNAL_BASE_URL:http://localhost:8888}
      token-uri: ${KEYCLOAK_SERVICE_TOKEN_URI:http://localhost:8180/realms/cinx/protocol/openid-connect/token}
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    cdn-url: ${AWS_S3_CDN_URL:https://cinx.sgp1.cdn.digitaloceanspaces.com}
    bucket: ${AWS_S3_BUCKET:cinx}
  region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
