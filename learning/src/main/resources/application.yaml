spring:
  application:
    name: learning
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
  cloud:
    openfeign:
      client:
        config:
          # a study reminder waits this long for the assistant's wording, then sends its template
          assistant-reminders:
            connect-timeout: 2000
            read-timeout: 5000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
security:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    audience: ${KEYCLOAK_AUDIENCE}
gateway.url: ${GATEWAY_URL}
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT}
    cdn-url: ${AWS_S3_CDN_URL}
    bucket: ${AWS_S3_BUCKET}
  region: ${AWS_REGION}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
server:
  port: 8084
cinx:
  assistant:
    # rewrites study reminders; not in Eureka
    internal-base-url: ${ASSISTANT_INTERNAL_BASE_URL:http://assistant:8092}
  security:
    authorization-freshness:
      enabled: true
      auth-base-url: ${AUTH_INTERNAL_BASE_URL:http://auth:8888}
      token-uri: ${KEYCLOAK_SERVICE_TOKEN_URI:http://keycloak:8080/realms/cinx/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:cinx-learning-service}
      client-secret: ${CINX_LEARNING_SERVICE_CLIENT_SECRET:}
      maximum-age: PT5S
